server:
  port: 8001

spring:
  cloud:
    vault:
      token: root
      uri: http://localhost:8200
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
  main:
    allow-bean-definition-overriding: true
  datasource:
    # H2
    #    url: jdbc:h2:mem:testdb
    #    driverClassName: org.h2.Driver
    # PostgreSQL local compose
    #    url: jdbc:postgresql://localhost:5432/postgres
    #    driverClassName: org.postgresql.Driver
    #    username: postgres
    #    password: changeme
    # PostgreSQL testcontainers
#    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  sql:
    init:
      mode: always
  kafka:
    consumer:
      group-id: order-loggers
      auto-offset-reset: earliest
#    bootstrap-servers: localhost:9092
#      bootstrap-servers: "${spring.embedded.kafka.brokers}"

kafka:
  topic-name-string: my-topic-string
  topic-name-object: my-topic-object
  stream-input-topic: input-topic
  stream-output-topic: output-topic
  stream-filtered-topic: filtered-topic
  messages-per-request: 10

notify-service:
  url: http://localhost:8001/notify