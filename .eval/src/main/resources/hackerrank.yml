version: 1.0
configuration:
  has_webserver: true
  readonly_paths:
    - .eval/*
  scoring:
    command: .eval/score.sh
    files:
      - .eval/target/surefire-reports/TEST-com.hackerrank.eval.BestPracticeTests.xml
      - .eval/target/surefire-reports/TEST-com.hackerrank.eval.FunctionalTests.xml
      - .eval/target/surefire-reports/TEST-com.hackerrank.eval.TestCoverageTests.xml
    test_total_score: 150 #Max points that can be obtained
    testcase_weights:
      # The weights must sum up to a total of 1
      # 1 point = 0.006
      # 5 points = 0.0333
      # 10 points = 0.0666
      # 20 points = 0.1333

      # Best practices(20 marks)
      statusCode404WhenNonExistentVulnerabilityRequested: 0.0333
      statusCodeSuccessWhenDeletingVulnerability: 0.0333
      statusCode404WhenTryingToDeleteNonExistentVulnerability: 0.0333
      statusCode400WhenSortByInvalid: 0.0333

      # Functional tests(90 marks)
      whenVulnerabilityRequestedThenCorrectOneIsReturned: 0.1333
      whenRequestingDeletionVulnerabilityIsSoftDeleted: 0.1333
      whenRequestingADeletedVulnerabilityThen404IsReturned: 0.0666
      deletedVulnerabilityNotPresentWhenRequestingAllVulnerability: 0.0666
      whenRequestingVulnerabilitiesSortedThenExpectRightOrder: 0.1333
      whenRequestingVulnerabilitiesSortedWithNoVulnerabilitiesExpectEmptyList: 0.0666

      #Writing 5 tests(40 marks)
      wroteAtLeastXNumberOfTests{int}[1]: 0.0666
      wroteAtLeastXNumberOfTests{int}[2]: 0.0666
      wroteAtLeastXNumberOfTests{int}[3]: 0.0333
      wroteAtLeastXNumberOfTests{int}[4]: 0.0333
      wroteAtLeastXNumberOfTests{int}[5]: 0.0673

  ide_config:
    default_open_files:
      - src/main/java/com/hackerrank/api/Application.java
    project_menu:
      run: mvn clean spring-boot:run
      install: mvn clean install
      test: mvn clean test
